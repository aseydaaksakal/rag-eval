site_name: rag-eval
site_url: https://aseydaaksakal.github.io/rag-eval/
repo_url: https://github.com/aseydaaksakal/rag-eval
repo_name: aseydaaksakal/rag-eval
site_description: Regression testing for RAG pipelines.
theme:
  name: material
  features: [navigation.sections, navigation.top, content.code.copy, search.suggest]
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle: { icon: material/brightness-4, name: Light mode }
markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Home: index.md
  - Playground: playground.html
  - Latest report: https://aseydaaksakal.github.io/rag-eval/report.html
  - Guides:
      - Getting started: getting-started.md
      - Metrics: metrics.md
      - Regression testing: regression-testing.md
      - Judges: judges.md
